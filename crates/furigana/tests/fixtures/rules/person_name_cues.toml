# 人名の手がかり (role = "person_name_cues")
#
# 人名の専用経路 (lib の PersonNamePass) が、 「この漢字の並びは人名だ」 と判断する手がかりの語。
# 姓の表 (core/names/ の role = "name_sei") と名の表 (role = "name_mei") だけでは、
# 水田 (みずた) のような語を一般語の読みと区別できないので、 直後の敬称・肩書きで人名と決める。
#
# このファイルが **正** で、 このファイルを読む lib は既定値を持たない。
# 古い lib (このファイルを知らない版) は読み飛ばし、 自前の同じ値で動く。
#
# 判定:
#   - 手がかり語そのもの、 または 手がかり語 + ひらがな (「選手たち」 「さんが」) だけを認める。
#     「選手権」 のように後ろに漢字が続く語は手がかりにしない
#   - 敬称は肩書きより強い手がかり (敬称 2 点 / 肩書き 1 点)
#
# 語を足す・削る時の注意:
#   - 一般語と衝突する語は入れない (様 / 君 / 殿 は 王子様・神様・諸君 と衝突するので敬称にしていない)
#   - 実コメントで確かめてから足す (誤爆すると、 普通の語が人名の読みに変わる)
#   - 1 語 16 字まで、 1 つの表は 1,000 語まで (validate が弾く)

[meta]
schema_version = "2"
role = "person_name_cues"
description = "人名の専用経路の手がかり (敬称・肩書き)"

[cues]
# 敬称 (読み方の揺れがない)
honorifics = ["さん", "ちゃん", "くん", "氏"]

# 肩書き・職名。 人名の直後に来る語 (単独の語としても読みが決まっているもの)
titles = [
  "選手", "監督", "先生", "社長", "議員", "首相", "大臣", "容疑者", "教授", "部長", "課長", "会長", "代表",
  "知事", "市長", "町長", "村長", "総理", "隊長", "校長", "医師", "投手", "騎手", "棋士", "名人", "記者",
  "弁護士", "被告", "被害者", "師匠", "先輩", "後輩", "コーチ", "キャプテン", "主将", "団長", "署長", "長官",
  "大統領", "元帥", "将軍", "監察官", "社員", "店長", "支配人", "理事長", "委員長", "幹事長", "党首", "総裁",
]

# 名の表にあるが、 実コメントでは一般語の誤認ばかりだった語 (新人さん / 初代大統領 / 勝利投手)
not_given_names = ["新人", "初代", "勝利"]

# 肩書きの直後に、 隣り合ってこの字で始まる token が続く時は、 医師会 / 記者会見 / 弁護士会 / 選手会 /
# 議員連盟 のような別の複合語で、 肩書きではない (日野市医師会 の 市 を名 (いち) にしないため)
compound_heads = ["会", "団", "連", "協", "組", "学", "院", "所"]