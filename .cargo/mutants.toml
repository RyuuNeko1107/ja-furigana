# cargo-mutants 設定 (テスト要件 STEP7 / §10)。
#
# exclude_re: 「等価変異 (どうテストしても殺せない / 到達不能コード)」を survivor ノイズと
# して出し続けないための除外。除外は必ず根拠とセットで記録する (= 安易な mutation 回避は
# 禁止。下記は到達不能の証明付き)。
exclude_re = [
    # DictBridgeProvider::emit_unihan — 後方互換の legacy フォールバック。
    # unihan map は必ず rich (insert) か kanji block と対で埋まるため、char_emitted が
    # 先に立ち本関数に到達しない (dict_bridge.rs の doc コメント参照)。到達不能 = 等価変異。
    # 将来 unihan-only の load 経路を足したら、この除外を消してフォールバックを直接テストする。
    "emit_unihan",

    # MatchContext::empty — 本体が `Self::default()` そのもの。mutation は
    # `Default::default()` への置換で、意味的に同一 = 真の等価変異。
    "MatchContext.*::empty",

    # kana.rs is_plain_char の NFKC 判定キャッシュ (NFKC_SELF) の hit 経路 (match の 1 / 2 の腕)。
    # 腕を消すと必ず `_` の腕 (= nfkc_self を計算して書き戻す) に落ちるだけで、 返す値は同じ。
    # キャッシュは速度だけに効く (出力は変わらない) ので、 結果で検出できない真の等価変異。
    "delete match arm [12] in is_plain_char",

    # Furigana::warm_up — 起動直後の遅延初期化を先に済ませるだけで、 戻り値も出力も変えない設計
    # (結果の cache が無い)。 空にしても観測できる差は最初のリクエストの遅さだけなので、 テストでは検出できない。
    # 「呼んでも出力が変わらない」 ことは api::tests::warm_up_does_not_change_output が固定している。
    "Furigana::warm_up",

    # Analyzer::tokenize_light の cache key `id | (lex_type << 32)` — id は 32 bit 未満で、 lex_type を 32 bit 左へ
    # 寄せているので 2 つは重なる bit を持たない。 `|` と `^` は同じ値になる (真の等価変異)。
    'replace \| with \^ in Analyzer::tokenize_light',

    # PersonNamePass::apply の `c = s + added + 1;` — c は 「手がかりの位置」。 置換後の手がかりは s + added にあり、
    # +1 はその次へ進める。 `*` に変えても (a) 手がかり自身をもう 1 度見る → 直前は置換済みで 「すでに正しい」 として読み飛ばし、
    # (b) 手がかりの次を飛ばす → 手がかりの次は漢字でない (敬称の直後) ので、 その位置が手がかりになる並びは無い。 出力は変わらない。
    'replace \+ with \* in <impl ReadingPostPass for PersonNamePass<.+>>::apply',

    # PersonNamePass::apply の最良の連なりの比較 `(姓+名の有無, 長さ) > (…)` — 長さは遡るごとに必ず増えるので、
    # 同点 (`>` と `>=` で結果が分かれる並び) は作れない (同じ長さの連なりは 1 つだけ)。
    'replace > with >= in <impl ReadingPostPass for PersonNamePass<.+>>::apply',
]

# 注記 (除外せず backlog 扱いの既知等価変異):
# - matcher.rs の MAX_LOGICAL_TOKEN_CHARS = MAX_DICT_VALUE_CHARS + 1 の `+` → `-`/`*` 変異は
#   挙動中立 (1024±1 / 1024*1 はどれも「最長 condition より長い」打ち切り境界として等価。
#   doc コメントの正しさ論証参照)。const 初期化子で fn 名が無く regex 除外しづらい。
# - matcher.rs next_logical_token の `end = start + idx + c.len_utf8()` (None→Some 分岐) の
#   `+` → `-` 変異は等価: この分岐は token 先頭 char でのみ発火し idx は常に 0 なので
#   start+0 == start-0。
# いずれも nightly full-mutation の既知 survivor として記録のみ (除外せず backlog)。
