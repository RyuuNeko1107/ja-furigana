name: Release

on:
  push:
    tags:
      - 'v*'
  # 手動実行も可 (テスト用)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ─── tag を解決して GitHub Release を先に作成 (無ければ) ───
  # taiki-e/upload-rust-binary-action は upload しかしない (release は別途作成必要)
  # ので、binary job が走る前に release を確保する。
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 解決された tag
        id: tag
        # script injection 防止: untrusted な inputs.tag を run: に直接展開せず
        # env 経由で受ける (shell では quote した "$INPUT_TAG" のみ参照)。
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Create release if missing (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # ※ Immutable Releases policy 下では published release に asset を
          # 追加できないため、 必ず --draft で create する。 binary 全アップロード
          # 完了後に finalize-release job で --draft=false に切り替え publish する。
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --draft \
              --generate-notes
          fi

  # ─── 各プラットフォームの binary をビルドして Release にアップロード ───
  binary:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain (stable + target)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Upload binary to Release
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: furigana
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Docker image を ghcr.io に push ───
  docker:
    name: Docker (ghcr.io)
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/furigana
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 全 binary upload 完了後に draft → 公開へ ───
  # Immutable Releases policy 下で published release は asset 追加不可なので、
  # create-release は draft で release を作り、 binary が全 platform 揃ってから
  # この job が --draft=false で publish する (immutability lock はここから発効)。
  finalize-release:
    name: Finalize Release (publish draft)
    needs: [create-release, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  # ─── crates.io へ 4 crate を依存順に公開 ───
  # secret CARGO_REGISTRY_TOKEN (publish 権限のみ) が要る。 environment `crates-io` に承認者を
  # 設定すると、 承認するまで公開されない (誤 tag による誤公開の防止)。
  # 公開済みの版は飛ばすので、 失敗後の再実行は安全。
  publish-crates:
    name: Publish to crates.io
    needs: [create-release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # 依存クレートの build.rs / proc-macro が走るのはここ。 トークンはこのステップの環境に無い
      - name: Build (トークン無しで検証ビルド)
        run: cargo build --release --workspace --locked
      - name: Publish (依存順、 公開済みは skip)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          VER="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="ja-furigana"))')"
          [ "v$VER" = "$TAG" ] || { echo "tag $TAG と Cargo.toml の版 $VER が違う"; exit 1; }
          for crate in ja-furigana ja-furigana-voicevox ja-furigana-aquestalk ja-furigana-cli; do
            if curl -sf "https://crates.io/api/v1/crates/$crate/$VER" -H 'User-Agent: ja-furigana-release' >/dev/null; then
              echo "$crate $VER は公開済み、 skip"; continue
            fi
            # 検証ビルドは上で済ませた (トークンを依存の build.rs に渡さないため --no-verify)
            cargo publish --no-verify -p "$crate"
            # 次の crate が依存解決できるよう index への反映を待つ
            for i in $(seq 1 30); do
              curl -sf "https://crates.io/api/v1/crates/$crate/$VER" -H 'User-Agent: ja-furigana-release' >/dev/null && break
              sleep 10
            done
          done
