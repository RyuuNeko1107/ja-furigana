name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:    # 手動再実行用 (dict 側 corpus 変更後に CI を再評価する等)
  schedule:
    # 毎週月曜 09:00 JST = 00:00 UTC に security audit を回す
    # (Dependabot の補完: cargo crate の advisory DB に新規エントリが入ったら検知)
    - cron: "0 0 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub の macOS runner queue が常に混雑して 10+ 分待ちになる問題の対策で
        # push / PR では Linux + Windows だけ走らせる。macOS 互換は週次 schedule の
        # `test-macos` job (下) でカバー。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Build (workspace)
        run: cargo build --workspace --all-targets

      - name: Test (workspace)
        run: cargo test --workspace

  test-macos:
    name: Test (macos-latest, weekly)
    runs-on: macos-latest
    # 毎週月曜 schedule trigger でだけ走らせる (audit と同タイミング)。
    # push / PR では走らせず、macOS runner の queue 詰まりを避ける。
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  license:
    name: License audit (cargo-about)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: license

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about

      # about.toml の accepted リストに無い license を持つ依存が増えたら fail。
      # OSS 化で copyleft (GPL/AGPL/LGPL) が混入してないかを CI で検知する。
      - name: Check license compatibility
        run: cargo about generate about.hbs -o /tmp/NOTICE.md

      # commit 済みの NOTICE.md と CI で生成したものに差があれば、
      # 開発者が cargo about generate を忘れた可能性 (drift 警告)。
      - name: Detect NOTICE.md drift
        run: |
          if ! diff -q NOTICE.md /tmp/NOTICE.md >/dev/null; then
            echo "::warning::NOTICE.md is out of sync with current dependencies."
            echo "Run \`cargo about generate about.hbs -o NOTICE.md\` and commit."
            diff NOTICE.md /tmp/NOTICE.md | head -50 || true
          fi

  audit:
    name: Security audit (cargo-audit)
    # push だけでなく pull_request / schedule でも走る (毎週 advisory check)
    runs-on: ubuntu-latest
    # advisory DB の更新で突然 fail するケースは「依存側の問題」なので、
    # blocking job ではなく warn 扱いにする (continue-on-error)。
    # 致命的な advisory が出たら手動で対応する運用。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings

  corpus:
    name: Corpus regression (ja-furigana-dict)
    # 辞書 PR で過去に通っていた読みが壊れていないか自動 check。
    # ja-furigana-dict/tests/corpus/should_read.toml の各 case を release binary で
    # 走らせる。Lindera + IPADIC の build が重いので毎回はやらず、push のみ。
    runs-on: ubuntu-latest
    needs: [test, lint]
    # corpus は ja-furigana-dict のスナップショット依存で fragile (片方の repo の
    # commit タイミングで一時的に壊れる)。master が壊れる原因にしないため、
    # 失敗しても blocking しない (情報通知のみ)。Dependabot PR の merge も妨げない。
    continue-on-error: true
    steps:
      - name: Checkout ja-furigana
        uses: actions/checkout@v6
        with:
          path: ja-furigana

      - name: Checkout ja-furigana-dict
        uses: actions/checkout@v6
        with:
          repository: RyuuNeko1107/ja-furigana-dict
          path: ja-furigana-dict

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: corpus
          workspaces: ja-furigana

      - name: Build release binary
        working-directory: ja-furigana
        run: cargo build --release -p ja-furigana-cli

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # corpus は ja-furigana-dict 側の master のスナップショットを使う。
      # 配布 (dict pull) を介さず repo 直下の core/ rules/ を flat 配置に変換して
      # `--data-dir` で渡す。
      - name: Stage dict / rules into flat data/ layout
        run: |
          mkdir -p data-staging/data
          cp -r ja-furigana-dict/core/* data-staging/data/ 2>/dev/null || true
          cp -r ja-furigana-dict/rules/* data-staging/data/ 2>/dev/null || true
          ls -la data-staging/data/

      - name: Run corpus runner against should_read.toml
        run: |
          python3 ja-furigana-dict/tools/run_corpus.py \
            ja-furigana-dict/tests/corpus/should_read.toml \
            --binary "$GITHUB_WORKSPACE/ja-furigana/target/release/furigana" \
            --data-dir "$GITHUB_WORKSPACE/data-staging" \
            -v

      - name: Run inline rule tests (各 dict / rule TOML 内 [[test]])
        # 各 file 末尾に書かれた inline test を集めて binary で検証。
        # corpus regression は repo 全体の最終 ロック、 inline test は file 単位の
        # 「この file が担当する変換」 ロック。 重複しても問題なし。
        run: |
          python3 ja-furigana-dict/tools/test_inline_rules.py \
            --binary "$GITHUB_WORKSPACE/ja-furigana/target/release/furigana" \
            --data-dir "$GITHUB_WORKSPACE/data-staging"

  # ── 差分カバレッジ ゲート (テスト要件 STEP7 / 階層 T1+ 必須) ──────────────────
  # 変更した行が新規/既存テストでカバーされているかを PR で強制する。
  # 全体カバレッジ閾値ではなく「当該変更の差分行」を見るので、無関係な未カバー領域に
  # 引っ張られず、追加コードのテスト漏れだけを検出できる (テスト要件 用語: 差分カバレッジ)。
  diff-coverage:
    name: Diff coverage (llvm-cov + diff-cover)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # diff-cover が base branch と比較するため全履歴が要る

      - name: Install Rust toolchain (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate lcov coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install diff-cover
        run: pip install "diff-cover>=9"

      # PR でのみ差分ゲートを発火。push (master 直) では総量レポートのみ。
      - name: Diff coverage gate (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          diff-cover lcov.info \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 80 \
            --markdown-report diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            diff-cover.md
          if-no-files-found: ignore

  # ── mutation (差分) ゲート (テスト要件 STEP7 / 階層 T2 で必須、PR は「一部=差分」) ──
  # 変更行に注入した変異をテストが検出 (=fail) できるかを確認する。
  # 「テストが通っている」だけでは、その行を何に書き換えても緑のままの「実質未検証」を
  # 見逃す。cargo-mutants --in-diff で当該 PR が触った行のみ高速に検査する。
  mutation-diff:
    name: Mutation (changed lines)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Compute PR diff (merge-base)
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" -- '*.rs' > pr.diff
          echo "--- changed Rust lines ---"; wc -l pr.diff

      # 生存変異 (caught されなかった変異) があれば cargo-mutants は非0で fail。
      # diff に .rs 変更が無い (= dict/doc のみの PR) 場合は変異対象ゼロで即 pass。
      - name: Mutation test on changed lines
        run: |
          cargo mutants --no-shuffle -j 2 --timeout 120 \
            --in-diff pr.diff \
            --package ja-furigana

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-diff
          path: mutants.out/
          if-no-files-found: ignore
